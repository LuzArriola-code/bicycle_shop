<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Papelera de Reciclaje</title>
    <link rel="stylesheet" href="papelera.css">
    <link rel="stylesheet" href="mensaje.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">

</head>

<body>

    <div id="miMensaje" style="display:none; position:fixed; top:10px; right:10px; z-index:999999; background:red; color:white; padding:20px; font-size:20px; border-radius:10px;">
    <span id="textoMensaje"></span>
</div>

    <header>
        <h1>🗑️ Papelera del Sistema</h1>
        <a href="index.html" class="btn-volver">Volver al Inicio</a>
    </header>
    <hr>

    <div class="form-group">
        <label for="selectTablas">Seleccionar Tabla:</label>
        <select id="selectTablas">
            <option value="" disabled selected>-- Elegir una opción --</option>
            <option value="usuarios" data-rol="Dueño" data-columnas="Nombre,Rol">Usuarios</option>
            <option value="proveedores" data-columnas="Nombre Completo,Telefono,Direccion">Proveedores</option>
            <option value="clientes" data-columnas="Nombre Completo,Telefono">Clientes</option>
            <option value="productos"
                data-columnas="N° Producto,Fecha,Proveedor,Tipo Producto,Nombre,Cantidad,Costo Total ">Productos
            </option>
            <option value="reparaciones" data-columnas="N° Repa,Fecha,ID Cliente,Tipo Repa,Bici,Costo,Estado Pago">
                Reparaciones
            </option>
            <option value="ventas"
                data-columnas="N° Venta,Fecha,Cliente,Categoría,Producto,Cantidad,Total Cobrado,Estado">Ventas</option>
        </select>
    </div>


    <div id="contenedorPapelera"></div>




<!---------------------------------------------------------->


    <script src="papelera.js"></script>
</body>

</html>
